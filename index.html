<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1f">
<title>Knall Admin</title>
<style>
:root{--bg:#0a0e1f;--card:#121833;--line:#222a4d;--txt:#e8ebff;--mut:#8f98c4;--ok:#35d07f;--bad:#ff5d6c;--warn:#ffb84d;--acc:#6c7bff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:0}
h2{font-size:14px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:#0d1230;border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:24px}
.stat span{color:var(--mut);font-size:12px}
input[type=text],input[type=password],textarea{width:100%;background:#0d1230;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#fff;cursor:pointer;font-weight:600}
.btn.sec{background:#1b2347;color:var(--txt)}
.btn.red{background:#5a2330}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mut);margin-right:6px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--acc);min-width:2px}
.bar span:first-child{width:90px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{display:flex;align-items:flex-end;gap:5px;height:90px}
.hist div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.hist div.e{background:var(--bad)}
.lbls{display:flex;gap:5px;font-size:10px;color:var(--mut)}.lbls span{flex:1;text-align:center}
.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border:0}
.sw input{width:46px;height:26px;accent-color:var(--acc)}
.err{border-left:3px solid var(--bad);padding:6px 10px;margin:8px 0;background:#0d1230;border-radius:0 8px 8px 0;font-size:13px}
.err small{color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
.k{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.k:last-child{border:0}
.lang{padding:6px 10px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b2347;border:1px solid var(--line);padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:9}
#toast.on{opacity:1}
.alerte{padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:14px;border:1px solid}
.alerte.bad{background:#3a1822;border-color:#7a2a3a}
.alerte.warn{background:#3a2e14;border-color:#7a5f20}
.sel{width:100%;background:#0d1230;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px}
.rowb{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.rowb .btn{flex:1;min-width:120px}
details summary{cursor:pointer;color:var(--mut);font-size:13px}
[hidden]{display:none!important}
</style>

    if(r.prompt){ var dt = ele("details", { style: "margin-top:6px" }); dt.appendChild(ele("summary", { text: t("voirPrompt") })); dt.appendChild(ele("pre", { text: r.prompt, style: "white-space:pre-wrap;font-size:12px" })); c.appendChild(dt); }
    return c;
  }
  async function runUn(body){ var r = await api("/admin/lab/run", { method: "POST", body: body }); if(r && r.restants !== undefined){ $("labRest").textContent = t("labRestants") + " " + r.restants; } return r; }
  async function pousserBrouillon(){ lireDraft(); var d = await api("/admin/lab/brouillon", { method: "PUT", body: { agents: labDLocal } }); labDLocal = clone(d.brouillon); montrerDraft(); }

  $("labRun").onclick = async function(){
    var q = $("labQ").value.trim(); if(!q){ toast(t("ecrisQ")); return; }
    var b = $("labRun"), R = $("labRes"); b.disabled = true; R.innerHTML = ""; R.appendChild(ele("span", { cls: "mut", text: t("enCours") }));
    var ver = $("labVer").value, versions = ver === "les2" ? ["actuel", "brouillon"] : [ver];
    try{
      if(versions.indexOf("brouillon") >= 0){ await pousserBrouillon(); }
      R.innerHTML = "";
      for(var i = 0; i < versions.length; i++){
        var r = await runUn({ agent: $("labAg").value, question: q, contexte: $("labCtx").value, version: versions[i], fournisseur: $("labProv").value, web: $("labWeb").checked, voirPrompt: $("labVoirP").checked });
        R.appendChild(carteRes(r, nomVer(versions[i])));
      }
    }catch(e){ R.innerHTML = ""; if(e.message === "401"){ deconnecte(t("tokenExp")); } else { R.appendChild(ele("div", { cls: "err", text: e.message })); } }
    b.disabled = false;
  };

  $("labDSave").onclick = async function(){ try{ await pousserBrouillon(); toast(t("sove")); }catch(e){ toast(e.message); } };
  $("labDCopy").onclick = async function(){ try{ var d = await api("/admin/lab/copier", { method: "POST" }); labDLocal = clone(d.brouillon); montrerDraft(); toast(t("copie")); }catch(e){ toast(e.message); } };
  $("labDPub").onclick = async function(){
    if(!confirm(t("confPub"))) return;
    try{ await pousserBrouillon(); await api("/admin/lab/publier", { method: "POST" }); remplirForm(await api("/admin/config")); toast(t("publie")); chargeVersions(); charge(); }
    catch(e){ toast(e.message); }
  };

  function rendreScenarios(){
    var box = $("scListe"); box.innerHTML = "";
    if(!lab.scenarios.length){ box.appendChild(ele("span", { cls: "mut", text: t("scAucun") })); return; }
    lab.scenarios.forEach(function(s){
      var l = ele("div", { cls: "k" });
      l.appendChild(ele("span", { text: s.nom + " · " + (NOM_AG[s.agent] || s.agent) }));
      var act = ele("span", { style: "display:flex;gap:6px" });
      var bt = ele("button", { type: "button", cls: "btn sec lang", text: "▶" }); bt.onclick = function(){ executerScenarios([s], versionsChoisies()); };
      var be = ele("button", { type: "button", cls: "btn sec lang", text: "✎" }); be.onclick = function(){ editerScenario(s); };
      var bd = ele("button", { type: "button", cls: "btn red lang", text: "✕" });
      bd.onclick = async function(){ if(!confirm(t("confSc"))) return; try{ await api("/admin/lab/scenario/supprimer", { method: "POST", body: { id: s.id } }); await chargeLab(); }catch(e){ toast(e.message); } };
      act.append(bt, be, bd); l.appendChild(act); box.appendChild(l);
    });
  }
  function editerScenario(s){
    scEditId = s.id; $("scNom").value = s.nom; $("scAg").value = s.agent; $("scQ").value = s.question; $("scCtx").value = s.contexte || "";
    $("scCont").value = (s.attendu.contient || []).join(", "); $("scInt").value = (s.attendu.interdit || []).join(", "); $("scMax").value = s.attendu.maxMots || 0; $("scNom").focus();
  }
  function viderFormSc(){ scEditId = null; ["scNom", "scQ", "scCtx", "scCont", "scInt"].forEach(function(i){ $(i).value = ""; }); $("scMax").value = 0; }
  function lireAttendu(){
    var sp = function(v){ return v.split(",").map(function(x){ return x.trim(); }).filter(Boolean); };
    return { contient: sp($("scCont").value), interdit: sp($("scInt").value), maxMots: parseInt($("scMax").value, 10) || 0 };
  }
  $("scSave").onclick = async function(){
    try{ await api("/admin/lab/scenario", { method: "POST", body: { id: scEditId, nom: $("scNom").value, agent: $("scAg").value, question: $("scQ").value, contexte: $("scCtx").value, attendu: lireAttendu() } }); viderFormSc(); await chargeLab(); toast(t("sove")); }
    catch(e){ toast(e.message); }
  };
  $("scClear").onclick = viderFormSc;
  function versionsChoisies(){ var v = $("scVer").value; return v === "les2" ? ["actuel", "brouillon"] : [v]; }

  async function executerScenarios(liste, versions){
    var R = $("scRes"), btn = $("scRunAll"); R.innerHTML = ""; btn.disabled = true; var resumes = [];
    try{
      if(versions.indexOf("brouillon") >= 0){ await pousserBrouillon(); }
      for(var vi = 0; vi < versions.length; vi++){
        var ver = versions[vi], ok = 0, echecs = [];
        var tete = ele("div", { style: "margin-top:12px;font-weight:700", text: "…" }); R.appendChild(tete);
        for(var i = 0; i < liste.length; i++){
          var s = liste[i]; tete.textContent = nomVer(ver) + " — " + (i + 1) + "/" + liste.length + " : " + s.nom;
          var r;
          try{ r = await runUn({ agent: s.agent, question: s.question, contexte: s.contexte, version: ver, attendu: s.attendu }); }
          catch(e){ if(e.message === "401") throw e; r = { provider: "—", ms: 0, mots: 0, reponse: "(erreur) " + e.message, verdict: { ok: false, echecs: [e.message] } }; }
          if(r.verdict && !r.verdict.ok){ echecs.push(s.nom); } else { ok++; }
          R.appendChild(carteRes(r, s.nom));
        }
        var score = liste.length ? Math.round(ok / liste.length * 100) : 0;
        tete.textContent = nomVer(ver) + " : " + ok + "/" + liste.length + " (" + score + " %)"; tete.style.color = couleurScore(score);
        resumes.push({ ver: ver, score: score });
        if(liste.length > 1){ try{ await api("/admin/lab/runs", { method: "POST", body: { version: ver, score: score, total: liste.length, ok: ok, echecs: echecs } }); }catch(e){} }
      }
      if(resumes.length === 2){ var diff = resumes[1].score - resumes[0].score; R.insertBefore(ele("div", { style: "margin-top:10px;font-weight:700;color:" + couleurScore(resumes[1].score), text: nomVer("actuel") + " " + resumes[0].score + " % → " + nomVer("brouillon") + " " + resumes[1].score + " % (" + (diff >= 0 ? "+" : "") + diff + ")" }), R.firstChild); }
      lab = await api("/admin/lab"); rendreRuns();
    }catch(e){ if(e.message === "401"){ deconnecte(t("tokenExp")); } else { R.appendChild(ele("div", { cls: "err", text: e.message })); } }
    btn.disabled = false;
  }
  $("scRunAll").onclick = function(){ if(!lab.scenarios.length){ toast(t("scAucun")); return; } executerScenarios(lab.scenarios.slice(), versionsChoisies()); };

  function rendreRuns(){
    var box = $("runListe"); box.innerHTML = "";
    if(!lab.runs.length){ box.appendChild(ele("span", { cls: "mut", text: t("aucunTest") })); return; }
    lab.runs.forEach(function(r){
      var l = ele("div", { cls: "k" });
      l.appendChild(ele("span", { text: fmtDate(r.t) + " · " + nomVer(r.version) }));
      l.appendChild(ele("span", { text: r.score + " % (" + r.ok + "/" + r.total + ")", style: "font-weight:700;color:" + couleurScore(r.score) }));
      box.appendChild(l);
    });
  }

  async function chargeVersions(){
    try{
      var v = await api("/admin/config/versions"), a = await api("/admin/audit");
      var bv = $("verListe"); bv.innerHTML = "";
      if(!v.versions.length){ bv.appendChild(ele("span", { cls: "mut", text: t("aucuneVer") })); }
      v.versions.forEach(function(x){
        var l = ele("div", { cls: "k" });
        l.appendChild(ele("span", { text: fmtDate(x.t) + " · " + x.note }));
        var b = ele("button", { type: "button", cls: "btn sec lang", text: t("restaurer") });
        b.onclick = async function(){ if(!confirm(t("confRest"))) return; try{ remplirForm(await api("/admin/config/restaurer", { method: "POST", body: { id: x.id } })); toast(t("restaure")); chargeVersions(); }catch(e){ toast(e.message); } };
        l.appendChild(b); bv.appendChild(l);
      });
      var ba = $("auditListe"); ba.innerHTML = "";
      a.audit.slice(0, 30).forEach(function(x){ var d = ele("div", { cls: "err", style: "border-left-color:var(--line)" }); d.appendChild(ele("div", { text: x.action + " — " + x.resume })); d.appendChild(ele("small", { text: fmtDate(x.t) })); ba.appendChild(d); });
    }catch(e){}
  }

  $("fsTest").onclick = async function(){
    var R = $("fsRes"); R.innerHTML = ""; $("fsTest").disabled = true;
    try{
      var d = await api("/admin/firestore/test", { method: "POST" });
      if(d.ok){
        R.appendChild(ele("div", { cls: "err", style: "border-left-color:var(--ok)", text: "✅ Firestore OK · " + d.ms + " ms · " + t("prefixe") + " : " + d.prefixe }));
        var c = d.comptes || {}; Object.keys(c).forEach(function(k){ var l = ele("div", { cls: "k" }); l.appendChild(ele("span", { text: k })); l.appendChild(ele("span", { text: c[k] === null ? "?" : String(c[k]) })); R.appendChild(l); });
      }else{ R.appendChild(ele("div", { cls: "err", text: "❌ " + (d.erreur || "échec") })); }
    }catch(e){ toast(e.message); }
    $("fsTest").disabled = false;
  };


  function remplirForm(c){
    $("cMaint").checked = !!c.maintenance; $("cMsgMaint").value = c.messageMaintenance || "";
    $("fChat").checked = c.fonctions.chat !== false; $("fImage").checked = c.fonctions.image !== false;
    $("fAudio").checked = c.fonctions.audio !== false; $("fPhotos").checked = c.fonctions.photos !== false; $("fDoc").checked = c.fonctions.document !== false;
    $("cAnons").value = c.anons || ""; $("cPrompt").value = c.promptExtra || "";
    fournList = ordonne((dernier && dernier.fournisseurs) || [], c.ordreFournisseurs || []); offSet = new Set(c.fournisseursOff || []); rendreFourn();
    $("cImgJour").value = c.imageMaxJour || 0; $("cImgApp").value = c.imageMaxAppareil || 0;
    agentsLocal = JSON.parse(JSON.stringify(c.agents || {})); agentSel = $("cAgSel").value || "general"; montrerAgent();
  }

  async function charge(){
    try{ dessine(await api("/admin/overview")); }
    catch(e){
      if(e.message === "401"){ deconnecte(t("tokenExp")); }
      else { $("maj").textContent = t("paKonekte"); }
    }
  }

  function montreApp(){ $("login").hidden = true; $("app").hidden = false; formCharge = false; charge(); clearInterval(timer); timer = setInterval(function(){ if(!document.hidden) charge(); }, 15000); }
  function deconnecte(msg){ clearInterval(timer); if(mode === "google" && fbAuth){ try{ fbAuth.signOut(); }catch(e){} } mode = "token"; efase(); token = ""; $("app").hidden = true; $("login").hidden = false; $("logErr").textContent = msg || ""; }

  $("antre").onclick = async function(){
    mode = "token"; base = $("url").value.trim().replace(/\/+$/, ""); token = $("tok").value.trim();
    if(!base || !token){ $("logErr").textContent = t("champs"); return; }
    $("antre").disabled = true; $("logErr").textContent = "";
    try{ await api("/admin/overview"); ecrire($("souvni").checked); montreApp(); }
    catch(e){ $("logErr").textContent = e.message === "401" ? t("tokenKo") : t("serveurKo"); }
    $("antre").disabled = false;
  };
  $("soti").onclick = function(){ deconnecte(""); $("tok").value = ""; };
  $("rafre").onclick = function(){ charge(); };

  /* ---------- Connaissances partagées (écrites par le serveur, pas par les apps) ---------- */
  var kb = { agent: "general", items: [], editId: null };
  function kbVider(){
    $("kbQ").value = ""; $("kbR").value = ""; $("kbTags").value = ""; kb.editId = null;
    $("kbSave").setAttribute("data-i", "kbAjouter"); $("kbSave").textContent = t("kbAjouter"); $("kbCancel").style.display = "none";
  }
  function kbErreur(e){ if(e && e.message === "401"){ deconnecte(t("tokenExp")); } else { toast((e && e.message) || "Erreur"); } }
  async function chargeKB(){
    try{
      var c = await api("/admin/knowledge");
      var agents = Object.keys(c.comptes || {}); if(!agents.length) agents = ["general","taches","code","recherche"];
      $("kbCol").textContent = t("kbCollection") + " : " + c.collection;
      var sel = $("kbAgent"); sel.innerHTML = "";
      agents.forEach(function(a){
        var o = document.createElement("option"); o.value = a;
        o.textContent = (({ general: "Général", taches: "Tâches", code: "Code", recherche: "Recherche", redaction: "Rédaction" })[a] || a) + (c.comptes && c.comptes[a] != null ? " (" + c.comptes[a] + ")" : "");
        sel.appendChild(o);
      });
      if(agents.indexOf(kb.agent) < 0) kb.agent = agents[0];
      sel.value = kb.agent;
      await chargeKBListe();
    }catch(e){ kbErreur(e); }
  }
  async function chargeKBListe(){
    var d = await api("/admin/knowledge?agent=" + encodeURIComponent(kb.agent));
    kb.items = (d.items || []).slice().sort(function(a, b){ return String(a.question).localeCompare(String(b.question), "fr"); });
    var box = $("kbListe"); box.innerHTML = "";
    if(!kb.items.length){ var v = document.createElement("span"); v.className = "mut"; v.textContent = t("kbVide"); box.appendChild(v); return; }
    kb.items.forEach(function(it){
      var c = document.createElement("div"); c.className = "err";
      var q = document.createElement("div"); q.style.fontWeight = "700"; q.textContent = it.question;
      var rep = String(it.reponse || ""); var r = document.createElement("div"); r.textContent = rep.length > 200 ? rep.slice(0, 200) + "…" : rep;
      var g = document.createElement("small"); g.textContent = (it.tags || []).join(", ");
      var row = document.createElement("div"); row.className = "rowb";
      var be = document.createElement("button"); be.type = "button"; be.className = "btn sec lang"; be.textContent = t("kbModifier");
      be.onclick = function(){
        kb.editId = it.id; $("kbQ").value = it.question; $("kbR").value = it.reponse; $("kbTags").value = (it.tags || []).join(", ");
        $("kbSave").setAttribute("data-i", "kbEnreg"); $("kbSave").textContent = t("kbEnreg"); $("kbCancel").style.display = "";
        try{ window.scrollTo({ top: 0, behavior: "smooth" }); }catch(e){}
      };
      var bd = document.createElement("button"); bd.type = "button"; bd.className = "btn red lang"; bd.textContent = t("supprimer");
      bd.onclick = async function(){
        if(!confirm(t("kbConfSupp"))) return;
        try{ await api("/admin/knowledge/supprimer", { method: "POST", body: { agent: kb.agent, id: it.id } }); toast(t("kbSupprime")); if(kb.editId === it.id) kbVider(); await chargeKB(); }catch(e){ kbErreur(e); }
      };
      row.append(be, bd); c.append(q, r, g, row); box.appendChild(c);
    });
  }
  $("kbAgent").onchange = async function(){ kb.agent = $("kbAgent").value; kbVider(); try{ await chargeKBListe(); }catch(e){ kbErreur(e); } };
  $("kbCancel").onclick = kbVider;
  $("kbSave").onclick = async function(){
    var q = $("kbQ").value.trim(), r = $("kbR").value.trim();
    if(!q || !r){ toast(t("kbChamps")); return; }
    var b = $("kbSave"); b.disabled = true;
    try{
      await api("/admin/knowledge", { method: "POST", body: { agent: kb.agent, id: kb.editId || undefined, question: q, reponse: r,
        tags: $("kbTags").value.split(",").map(function(s){ return s.trim(); }).filter(Boolean) } });
      toast(t("kbSauve")); kbVider(); await chargeKB();
    }catch(e){ kbErreur(e); }
    b.disabled = false;
  };
  function kbLire(txt){
    var d = JSON.parse(txt);
    if(!Array.isArray(d) && d && typeof d === "object"){
      var l = ["items","entries","connaissances","knowledge","faq","data"].map(function(k){ return d[k]; }).find(Array.isArray);
      d = l || Object.keys(d).map(function(k){ return { question: k, reponse: d[k], tags: [k] }; });
    }
    if(!Array.isArray(d)) return [];
    return d.map(function(x){
      if(!x || typeof x !== "object") return null;
      var q = x.question || x.q || x.mot || x.term, r = x.reponse || x["réponse"] || x.answer || x.r || x.definition;
      if(typeof q !== "string" || typeof r !== "string") return null;
      return { question: q.trim().slice(0, 500), reponse: r.trim().slice(0, 20000), tags: Array.isArray(x.tags) ? x.tags : [] };
    }).filter(function(x){ return x && x.question && x.reponse; });
  }
  $("kbImpBtn").onclick = async function(){
    var liste; try{ liste = kbLire($("kbImp").value); }catch(e){ liste = []; }
    if(!liste.length){ toast(t("kbJsonBad")); return; }
    var b = $("kbImpBtn"); b.disabled = true; var n = 0;
    try{
      for(var i = 0; i < liste.length; i += 300){
        var r = await api("/admin/knowledge/import", { method: "POST", body: { agent: kb.agent, items: liste.slice(i, i + 300) } });
        n += r.ajoutes || 0;
      }
      toast(n + " " + t("kbImporte")); $("kbImp").value = ""; await chargeKB();
    }catch(e){ kbErreur(e); }
    b.disabled = false;
  };

  $("tabs").onclick = function(ev){
    var b = ev.target.closest(".tab"); if(!b) return;
    tabAktif = b.dataset.t; if(tabAktif === "sig"){ chargeSignalements(); } if(tabAktif === "lab"){ chargeLab(); } if(tabAktif === "kb"){ chargeKB(); }
    document.querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("on", x === b); });
    ["apesi","kontwol","ere","sig","lab","kb","sante"].forEach(function(n){ $("t-" + n).hidden = (n !== tabAktif); });
  };

    var b = $("sove"); b.disabled = true; lireAgentForm();

      var cfg = await api("/admin/config", { method: "PUT", body: {
        maintenance: $("cMaint").checked, messageMaintenance: $("cMsgMaint").value,
        anons: $("cAnons").value, promptExtra: $("cPrompt").value,
        fournisseursOff: Array.from(offSet), ordreFournisseurs: fournList.slice(), agents: agentsLocal,
        imageMaxJour: parseInt($("cImgJour").value, 10) || 0, imageMaxAppareil: parseInt($("cImgApp").value, 10) || 0,
        fonctions: { chat: $("fChat").checked, image: $("fImage").checked, audio: $("fAudio").checked, photos: $("fPhotos").checked, document: $("fDoc").checked }
      }});
      remplirForm(cfg); toast(t("sove")); charge();
    }catch(e){ toast(e.message === "401" ? t("sesyon") : e.message); }
    b.disabled = false;
  };

  $("vide").onclick = async function(){
    if(!confirm(t("confVider"))) return;
    try{ await api("/admin/erreurs/vider", { method: "POST" }); toast(t("vide")); charge(); }catch(e){ toast(e.message); }
  };

  $("teste").onclick = async function(){
    var b = $("teste"), R = $("testRes"); b.disabled = true; R.innerHTML = ""; var w = document.createElement("span"); w.className = "mut"; w.textContent = t("enCours"); R.appendChild(w);
    try{
      var d = await api("/admin/test", { method: "POST" });
      R.innerHTML = "";
      if(!d.resultats.length){ var n = document.createElement("span"); n.className = "mut"; n.textContent = t("aucunFourn"); R.appendChild(n); }
      d.resultats.forEach(function(x){
        var r = document.createElement("div"); r.className = "k";
        var a = document.createElement("span"); a.textContent = x.nom;
        var c = document.createElement("span");
        c.innerHTML = '<span class="dot ' + (x.ok ? "ok" : "bad") + '"></span>';
        c.appendChild(document.createTextNode(x.ok ? "OK · " + x.ms + " ms" : (x.erreur || t("echec"))));
        r.append(a, c); R.appendChild(r);
      });
    }catch(e){ R.innerHTML = ""; toast(e.message); }
    b.disabled = false;
  };

  $("gBtn").onclick = async function(){
    if(!fbAuth){ $("logErr").textContent = t("fbKo"); return; }
    $("logErr").textContent = "";
    try{ await fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    catch(e){ $("logErr").textContent = t("gKo") + " (" + (e.code || e.message) + ")."; }
  };
  if(fbAuth){
    fbAuth.onAuthStateChanged(async function(u){
      if(!u || (mode === "token" && token)) return;
      base = $("url").value.trim().replace(/\/+$/, ""); mode = "google";
      try{ await api("/admin/overview"); ecrire(true); montreApp(); }
      catch(e){ deconnecte(e.message === "401" ? (t("mailNon") + " " + (u.email || "")) : t("serveurKo2")); }
    });
  }

  appliqueLangue();
  // Reconnexion automatique si le jeton a été enregistré
  (function init(){
    var u = lire("kadm_url"), tk = lire("kadm_tok");
    if(u) $("url").value = u;
    if(u && tk){ base = u; token = tk; api("/admin/overview").then(function(){ montreApp(); }).catch(function(){ deconnecte(""); }); }
  })();
})();
