<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1f">
<title>Knall Admin</title>
<style>
:root{--bg:#0a0e1f;--card:#121833;--line:#222a4d;--txt:#e8ebff;--mut:#8f98c4;--ok:#35d07f;--bad:#ff5d6c;--warn:#ffb84d;--acc:#6c7bff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:0}
h2{font-size:14px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:#0d1230;border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:24px}
.stat span{color:var(--mut);font-size:12px}
input[type=text],input[type=password],textarea{width:100%;background:#0d1230;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#fff;cursor:pointer;font-weight:600}
.btn.sec{background:#1b2347;color:var(--txt)}
.btn.red{background:#5a2330}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mut);margin-right:6px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--acc);min-width:2px}
.bar span:first-child{width:90px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{display:flex;align-items:flex-end;gap:5px;height:90px}
.hist div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.hist div.e{background:var(--bad)}
.lbls{display:flex;gap:5px;font-size:10px;color:var(--mut)}.lbls span{flex:1;text-align:center}
.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border:0}
.sw input{width:46px;height:26px;accent-color:var(--acc)}
.err{border-left:3px solid var(--bad);padding:6px 10px;margin:8px 0;background:#0d1230;border-radius:0 8px 8px 0;font-size:13px}
.err small{color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
.k{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.k:last-child{border:0}
.lang{padding:6px 10px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b2347;border:1px solid var(--line);padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:9}
#toast.on{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>

<!-- Connexion -->
<div id="login" class="wrap" style="max-width:420px;padding-top:12vh">
  <div class="card">
    <div class="row"><h1>⚡ Knall Admin</h1><button class="btn sec lang" id="langL" type="button">KR</button></div>
    <p class="mut" data-i="loginSub"></p>
    <p><input id="url" type="text" placeholder="https://knall-1.onrender.com" value="https://knall-1.onrender.com" autocomplete="off" autocapitalize="off"></p>
    <p><button class="btn" id="gBtn" style="width:100%" data-i="google"></button></p>
    <p class="mut" style="text-align:center;margin:6px 0" data-i="ouToken"></p>
    <p><input id="tok" type="password" data-ph="phTok" autocomplete="off"></p>
    <label class="mut"><input id="souvni" type="checkbox"> <span data-i="souvenir"></span></label>
    <p><button class="btn sec" id="antre" style="width:100%" data-i="antreToken"></button></p>
    <p class="mut" id="logErr" style="color:var(--bad)"></p>
  </div>
</div>

<!-- Tableau de bord -->
<div id="app" class="wrap" hidden>
  <div class="row">
    <h1>⚡ Knall Admin</h1>
    <div class="row" style="gap:8px">
      <span class="mut" id="maj">—</span>
      <button class="btn sec lang" id="langA" type="button">KR</button>
      <button class="btn sec" id="rafre" data-i="rafre"></button>
      <button class="btn sec" id="soti" data-i="soti"></button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-t="apesi" data-i="tabApesi"></button>
    <button class="tab" data-t="kontwol" data-i="tabKontwol"></button>
    <button class="tab" data-t="ere" data-i="tabEre"></button>
    <button class="tab" data-t="sante" data-i="tabSante"></button>
  </div>

  <!-- Aperçu -->
  <section id="t-apesi">
    <div class="card">
      <h2 data-i="serveur"></h2>
      <div class="grid">
        <div class="stat"><b id="sEtat">—</b><span data-i="etat"></span></div>
        <div class="stat"><b id="sUp">—</b><span data-i="actifDepuis"></span></div>
        <div class="stat"><b id="sMem">—</b><span data-i="historique"></span></div>
      </div>
    </div>
    <div class="card">
      <h2 data-i="aujourdhui"></h2>
      <div class="grid">
        <div class="stat"><b id="jTot">0</b><span data-i="reqTotal"></span></div>
        <div class="stat"><b id="jOk" style="color:var(--ok)">0</b><span data-i="reussies"></span></div>
        <div class="stat"><b id="jEch" style="color:var(--bad)">0</b><span data-i="echecs"></span></div>
        <div class="stat"><b id="jRef" style="color:var(--warn)">0</b><span data-i="refusees"></span></div>
        <div class="stat"><b id="jMs">0</b><span data-i="tempsMoyen"></span></div>
      </div>
    </div>
    <div class="card"><h2 data-i="parFonction"></h2><div id="parFonc"></div></div>
    <div class="card"><h2 data-i="parAgent"></h2><div id="parAgent"></div></div>
    <div class="card"><h2 data-i="fournisseur"></h2><div id="parProv"></div></div>
    <div class="card"><h2 data-i="derniersJours"></h2><div class="hist" id="hist"></div><div class="lbls" id="histL"></div><p class="mut" data-i="rougeEchecs"></p></div>
  </section>

  <!-- Contrôle -->
  <section id="t-kontwol" hidden>
    <div class="card">
      <h2 data-i="modeMaint"></h2>
      <div class="sw"><span><span data-i="mettreMaint"></span><br><small class="mut" data-i="toutFerme"></small></span><input type="checkbox" id="cMaint"></div>
      <p><input id="cMsgMaint" type="text" maxlength="200" data-ph="phMaint"></p>
    </div>
    <div class="card">
      <h2 data-i="fonctions"></h2>
      <div class="sw"><span data-i="fChat"></span><input type="checkbox" id="fChat"></div>
      <div class="sw"><span data-i="fImage"></span><input type="checkbox" id="fImage"></div>
      <div class="sw"><span data-i="fAudio"></span><input type="checkbox" id="fAudio"></div>
      <div class="sw"><span data-i="fPhotos"></span><input type="checkbox" id="fPhotos"></div>
      <div class="sw"><span data-i="fDoc"></span><input type="checkbox" id="fDoc"></div>
    </div>
    <div class="card">
      <h2 data-i="annonce"></h2>
      <textarea id="cAnons" maxlength="300" data-ph="phAnnonce"></textarea>
    </div>
    <div class="card">
      <h2 data-i="instr"></h2>
      <p class="mut" data-i="instrDesc"></p>
      <textarea id="cPrompt" maxlength="2000" style="min-height:140px" data-ph="phPrompt"></textarea>
    </div>
    <button class="btn" id="sove" style="width:100%" data-i="enregistrer"></button>
  </section>

  <!-- Erreurs -->
  <section id="t-ere" hidden>
    <div class="card">
      <div class="row"><h2 style="margin:0" data-i="dernieresErr"></h2><button class="btn red" id="vide" data-i="vider"></button></div>
      <p class="mut" data-i="aucunMsg"></p>
      <div id="erreurs"></div>
    </div>
  </section>

  <!-- Santé -->
  <section id="t-sante" hidden>
    <div class="card"><h2 data-i="cles"></h2><div id="cles"></div></div>
    <div class="card">
      <h2 data-i="testerIA"></h2>
      <p class="mut" data-i="testDesc"></p>
      <p><button class="btn" id="teste" data-i="testerMaint"></button></p>
      <div id="testRes"></div>
    </div>
  </section>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var base = "", token = "", timer = null, tabAktif = "apesi", dernier = null, formCharge = false;
  var mode = "token", fbAuth = null;
  var FB_CONFIG = {
    apiKey: "AIzaSyDVcE23SZKF941Q9AI31vpwJRt1aw1QWQo",
    authDomain: "knall-b14e6.firebaseapp.com",
    projectId: "knall-b14e6",
    appId: "1:259374045941:web:4ab884c3d967dda34343bc"
  };
  try{ if(window.firebase){ firebase.initializeApp(FB_CONFIG); fbAuth = firebase.auth(); } }catch(e){ fbAuth = null; }

  /* ---------- Langue : français par défaut, kréyol en option ---------- */
  var D = {
    loginSub:["Entrez l'adresse du serveur et connectez-vous.","Antre adrès sèvè a epi konekte."],
    google:["Se connecter avec Google","Konekte ak Google"],
    ouToken:["— ou avec un jeton —","— oswa ak token —"],
    phTok:["Jeton admin (ADMIN_TOKEN)","Token admin (ADMIN_TOKEN)"],
    souvenir:["Se souvenir de moi sur cet appareil","Sonje m sou aparèy sa a"],
    antreToken:["Entrer avec le jeton","Antre ak token"],
    rafre:["Actualiser","Rafrechi"], soti:["Quitter","Sòti"],
    tabApesi:["Aperçu","Apèsi"], tabKontwol:["Contrôle","Kontwòl"], tabEre:["Erreurs","Erè"], tabSante:["Santé","Sante"],
    serveur:["Serveur","Sèvè"], etat:["État","Eta"], actifDepuis:["Actif depuis","Aktif depi"], historique:["Historique conservé","Istwa konsève"],
    aujourdhui:["Aujourd'hui","Jodi a"], reqTotal:["Requêtes au total","Rekèt total"], reussies:["Réussies","Reyisi"], echecs:["Échecs","Echèk"],
    refusees:["Refusées","Refize"], tempsMoyen:["Temps moyen (ms)","Tan mwayen (ms)"],
    parFonction:["Par fonction","Pa fonksyon"], parAgent:["Par agent (chat)","Pa ajan (chat)"], fournisseur:["Fournisseur qui répond","Ki founisè ki reponn"],
    derniersJours:["Derniers jours","Dènye jou yo"], rougeEchecs:["Rouge = échecs.","Wouj = echèk."],
    modeMaint:["Mode maintenance","Mòd antretyen"], mettreMaint:["Mettre Knall en maintenance","Mete Knall an antretyen"],
    toutFerme:["Toutes les fonctions restent fermées.","Tout fonksyon yo rete fèmen."],
    phMaint:["Message de maintenance (facultatif)","Mesaj antretyen (opsyonèl)"],
    fonctions:["Fonctions","Fonksyon yo"], fChat:["Chat","Chat"], fImage:["Images","Imaj"], fAudio:["Audio / voix","Odyo / vwa"],
    fPhotos:["Photos (recherche)","Foto (rechèch)"], fDoc:["Documents","Dokiman"],
    annonce:["Annonce pour les utilisateurs","Anons pou itilizatè yo"],
    phAnnonce:["Un court message affiché dans l'application","Yon mesaj kout ki parèt nan aplikasyon an"],
    instr:["Instructions supplémentaires pour Knall","Enstriksyon anplis pou Knall"],
    instrDesc:["Ajoutées au prompt de Knall, sans redéployer. N'y mettez aucun secret. 2000 caractères max.","Ajoute nan prompt Knall la, san redéploye. Pa mete sekrè la. Maks 2000 karaktè."],
    phPrompt:["Exemple : répondre toujours en créole si la personne écrit en créole.","Egzanp: Reponn toujou an kreyòl si moun nan ekri an kreyòl."],
    enregistrer:["Enregistrer les modifications","Sove chanjman yo"],
    dernieresErr:["Dernières erreurs","Dènye erè yo"], vider:["Vider","Vide"],
    aucunMsg:["Aucun message d'utilisateur ici, seulement des codes et des temps.","Pa gen mesaj itilizatè isit la, sèlman kòd ak tan."],
    cles:["Clés (présentes / absentes)","Kle yo (mete / pa mete)"], testerIA:["Tester les fournisseurs IA","Teste founisè AI yo"],
    testDesc:["Envoie une toute petite question à chaque fournisseur. Cela ne coûte presque rien. (Les images ne sont pas testées pour ne pas gaspiller de Pollen.)","Voye yon ti kesyon bay chak founisè. Sa koute prèske anyen. (Imaj yo pa teste pou pa gaspiye Pollen.)"],
    testerMaint:["Tester maintenant","Teste kounye a"],
    /* messages dynamiques */
    enMaint:["En maintenance","Antretyen"], enLigne:["En ligne","An liy"], oui:["Oui (Firestore)","Wi (Firestore)"], non:["Non (mémoire)","Non (memwa)"],
    pasDonnees:["Pas encore de données aujourd'hui.","Pa gen done ankò jodi a."], aucuneErr:["Aucune erreur. 🎉","Pa gen erè. 🎉"],
    present:["présente","mete"], absent:["absente","pa mete"],
    uS:[" s"," s"], uMin:[" min"," min"], uH:[" h"," è"], uJ:[" j"," j"],
    champs:["Remplissez les deux champs.","Ranpli tou de chan yo."], tokenKo:["Jeton invalide.","Token pa bon."],
    serveurKo:["Impossible de joindre le serveur (il dort peut-être, réessayez dans 30 secondes).","Pa ka kontakte sèvè a (li ka dòmi, eseye ankò nan 30 segonn)."],
    tokenExp:["Jeton invalide ou expiré.","Token pa bon oswa ekspire."],
    fbKo:["Firebase non chargé (vérifiez la connexion Internet).","Firebase pa chaje (verifye entènèt la)."],
    gKo:["Connexion Google échouée","Koneksyon Google echwe"],
    mailNon:["Adresse e-mail non autorisée :","Imèl sa a pa otorize :"],
    serveurKo2:["Impossible de joindre le serveur (il dort peut-être, réessayez).","Pa ka kontakte sèvè a (li ka dòmi, eseye ankò)."],
    sove:["Enregistré ✓","Sove ✓"], sesyon:["Session expirée","Sesyon fini"],
    confVider:["Vider la liste des erreurs ?","Vide lis erè yo?"], vide:["Vidée ✓","Vide ✓"],
    paKonekte:["Non connecté","Pa konekte"], enCours:["Test en cours…","Ap teste…"], aucunFourn:["Aucun fournisseur configuré.","Okenn founisè konfigire."], echec:["échec","echèk"],
    ctrlOk:["OK","OK"]
  };
  var LANG = "fr";
  try{ var lg = localStorage.getItem("kadm_lang"); if(lg === "ht" || lg === "fr") LANG = lg; }catch(e){}
  function t(k){ var v = D[k]; return v ? v[LANG === "ht" ? 1 : 0] : k; }
  function appliqueLangue(){
    document.documentElement.lang = LANG === "ht" ? "ht" : "fr";
    document.querySelectorAll("[data-i]").forEach(function(e){ e.textContent = t(e.getAttribute("data-i")); });
    document.querySelectorAll("[data-ph]").forEach(function(e){ e.placeholder = t(e.getAttribute("data-ph")); });
    var lab = LANG === "ht" ? "FR" : "KR";
    $("langL").textContent = lab; $("langA").textContent = lab;
    if(dernier) dessine(dernier);
  }
  function changerLangue(){
    LANG = LANG === "ht" ? "fr" : "ht";
    try{ localStorage.setItem("kadm_lang", LANG); }catch(e){}
    appliqueLangue();
  }
  $("langL").onclick = changerLangue; $("langA").onclick = changerLangue;

  function toast(m){ var e=$("toast"); e.textContent=m; e.classList.add("on"); setTimeout(function(){ e.classList.remove("on"); }, 2200); }
  function lire(k){ try{ return localStorage.getItem(k) || sessionStorage.getItem(k) || ""; }catch(e){ return ""; } }
  function ecrire(souvni){
    try{
      localStorage.removeItem("kadm_url"); localStorage.removeItem("kadm_tok");
      var st = souvni ? localStorage : sessionStorage;
      st.setItem("kadm_url", base); st.setItem("kadm_tok", token);
    }catch(e){}
  }
  function efase(){ try{ localStorage.removeItem("kadm_tok"); sessionStorage.removeItem("kadm_tok"); }catch(e){} }

  async function entete(){
    if(mode === "google" && fbAuth && fbAuth.currentUser){ return { "authorization": "Bearer " + await fbAuth.currentUser.getIdToken() }; }
    return { "x-admin-token": token };
  }
  async function api(chemin, opts){
    opts = opts || {};
    var h = await entete();
    if(opts.body){ h["content-type"] = "application/json"; }
    var r = await fetch(base + chemin, { method: opts.method || "GET", headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined });
    var d = null; try{ d = await r.json(); }catch(e){}
    if(r.status === 401){ throw new Error("401"); }
    if(!r.ok){ throw new Error((d && d.error) || ("Erreur " + r.status)); }
    return d;
  }

  function duree(s){
    if(s < 60) return s + t("uS");
    if(s < 3600) return Math.floor(s/60) + t("uMin");
    if(s < 86400) return Math.floor(s/3600) + t("uH") + " " + Math.floor((s%3600)/60) + t("uMin");
    return Math.floor(s/86400) + t("uJ") + " " + Math.floor((s%86400)/3600) + t("uH");
  }
  function bars(el, obj){
    el.innerHTML = "";
    var cles = Object.keys(obj).sort(function(a,b){ return obj[b]-obj[a]; });
    if(!cles.length){ el.innerHTML = '<span class="mut"></span>'; el.firstChild.textContent = t("pasDonnees"); return; }
    var max = obj[cles[0]] || 1;
    cles.forEach(function(k){
      var r = document.createElement("div"); r.className = "bar";
      var a = document.createElement("span"); a.textContent = k;
      var b = document.createElement("i"); b.style.width = Math.max(2, Math.round(obj[k]/max*100)*0.6) + "%";
      var c = document.createElement("span"); c.textContent = obj[k];
      r.append(a, b, c); el.appendChild(r);
    });
  }

  function dessine(o){
    dernier = o;
    var s = o.serveur, j = o.jour;
    $("sEtat").innerHTML = '<span class="dot ' + (o.config.maintenance ? "warn" : "ok") + '"></span>';
    $("sEtat").appendChild(document.createTextNode(o.config.maintenance ? t("enMaint") : t("enLigne")));
    $("sUp").textContent = duree(s.uptime);
    $("sMem").textContent = s.historiquePersistant ? t("oui") : t("non");
    var tot = Object.keys(j.total).reduce(function(a,k){ return a + j.total[k]; }, 0);
    $("jTot").textContent = tot; $("jOk").textContent = j.ok; $("jEch").textContent = j.echecs; $("jRef").textContent = j.refuses;
    $("jMs").textContent = j.msN ? Math.round(j.msSomme / j.msN) : 0;
    bars($("parFonc"), j.total); bars($("parAgent"), j.parAgent); bars($("parProv"), j.parProvider);

    var h = $("hist"), hl = $("histL"); h.innerHTML = ""; hl.innerHTML = "";
    var mx = Math.max.apply(null, o.historique.map(function(x){ return x.total; }).concat([1]));
    o.historique.forEach(function(x){
      var d = document.createElement("div"); d.style.height = Math.max(3, Math.round(x.total/mx*100)) + "%"; d.title = x.date + " : " + x.total;
      if(x.echecs > 0){ d.className = "e"; }
      h.appendChild(d);
      var l = document.createElement("span"); l.textContent = x.date.slice(8); hl.appendChild(l);
    });

    var E = $("erreurs"); E.innerHTML = "";
    if(!o.erreurs.length){ var v = document.createElement("span"); v.className = "mut"; v.textContent = t("aucuneErr"); E.appendChild(v); }
    o.erreurs.forEach(function(e){
      var d = document.createElement("div"); d.className = "err";
      var hh = new Date(e.t).toLocaleString("fr-FR", { timeZone: "America/Port-au-Prince" });
      var a = document.createElement("div"); a.textContent = e.route + (e.agent ? " · " + e.agent : "") + " · HTTP " + e.status + " · " + e.ms + " ms";
      var b = document.createElement("small"); b.textContent = hh + (e.msg ? " — " + e.msg : "");
      d.append(a, b); E.appendChild(d);
    });

    var C = $("cles"); C.innerHTML = "";
    var noms = { anthropic:"Claude (Anthropic)", gemini:"Gemini", groq:"Groq", cerebras:"Cerebras", openrouter:"OpenRouter", mistral:"Mistral",
      pollinations: LANG === "ht" ? "Pollinations (imaj)" : "Pollinations (images)", cloudflare: LANG === "ht" ? "Cloudflare (imaj gratis)" : "Cloudflare (images gratuites)",
      firebase:"Firebase", tokenApp: LANG === "ht" ? "Token aplikasyon" : "Jeton application", tokenAdmin: LANG === "ht" ? "Token admin" : "Jeton admin" };
    Object.keys(noms).forEach(function(k){
      var r = document.createElement("div"); r.className = "k";
      var a = document.createElement("span"); a.textContent = noms[k];
      var b = document.createElement("span"); b.innerHTML = '<span class="dot ' + (o.cles[k] ? "ok" : "bad") + '"></span>';
      b.appendChild(document.createTextNode(o.cles[k] ? t("present") : t("absent")));
      r.append(a, b); C.appendChild(r);
    });

    if(!formCharge){ remplirForm(o.config); formCharge = true; }
    $("maj").textContent = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function remplirForm(c){
    $("cMaint").checked = !!c.maintenance; $("cMsgMaint").value = c.messageMaintenance || "";
    $("fChat").checked = c.fonctions.chat !== false; $("fImage").checked = c.fonctions.image !== false;
    $("fAudio").checked = c.fonctions.audio !== false; $("fPhotos").checked = c.fonctions.photos !== false; $("fDoc").checked = c.fonctions.document !== false;
    $("cAnons").value = c.anons || ""; $("cPrompt").value = c.promptExtra || "";
  }

  async function charge(){
    try{ dessine(await api("/admin/overview")); }
    catch(e){
      if(e.message === "401"){ deconnecte(t("tokenExp")); }
      else { $("maj").textContent = t("paKonekte"); }
    }
  }

  function montreApp(){ $("login").hidden = true; $("app").hidden = false; formCharge = false; charge(); clearInterval(timer); timer = setInterval(function(){ if(!document.hidden) charge(); }, 15000); }
  function deconnecte(msg){ clearInterval(timer); if(mode === "google" && fbAuth){ try{ fbAuth.signOut(); }catch(e){} } mode = "token"; efase(); token = ""; $("app").hidden = true; $("login").hidden = false; $("logErr").textContent = msg || ""; }

  $("antre").onclick = async function(){
    mode = "token"; base = $("url").value.trim().replace(/\/+$/, ""); token = $("tok").value.trim();
    if(!base || !token){ $("logErr").textContent = t("champs"); return; }
    $("antre").disabled = true; $("logErr").textContent = "";
    try{ await api("/admin/overview"); ecrire($("souvni").checked); montreApp(); }
    catch(e){ $("logErr").textContent = e.message === "401" ? t("tokenKo") : t("serveurKo"); }
    $("antre").disabled = false;
  };
  $("soti").onclick = function(){ deconnecte(""); $("tok").value = ""; };
  $("rafre").onclick = function(){ charge(); };

  $("tabs").onclick = function(ev){
    var b = ev.target.closest(".tab"); if(!b) return;
    tabAktif = b.dataset.t;
    document.querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("on", x === b); });
    ["apesi","kontwol","ere","sante"].forEach(function(n){ $("t-" + n).hidden = (n !== tabAktif); });
  };

  $("sove").onclick = async function(){
    var b = $("sove"); b.disabled = true;
    try{
      var cfg = await api("/admin/config", { method: "PUT", body: {
        maintenance: $("cMaint").checked, messageMaintenance: $("cMsgMaint").value,
        anons: $("cAnons").value, promptExtra: $("cPrompt").value,
        fonctions: { chat: $("fChat").checked, image: $("fImage").checked, audio: $("fAudio").checked, photos: $("fPhotos").checked, document: $("fDoc").checked }
      }});
      remplirForm(cfg); toast(t("sove")); charge();
    }catch(e){ toast(e.message === "401" ? t("sesyon") : e.message); }
    b.disabled = false;
  };

  $("vide").onclick = async function(){
    if(!confirm(t("confVider"))) return;
    try{ await api("/admin/erreurs/vider", { method: "POST" }); toast(t("vide")); charge(); }catch(e){ toast(e.message); }
  };

  $("teste").onclick = async function(){
    var b = $("teste"), R = $("testRes"); b.disabled = true; R.innerHTML = ""; var w = document.createElement("span"); w.className = "mut"; w.textContent = t("enCours"); R.appendChild(w);
    try{
      var d = await api("/admin/test", { method: "POST" });
      R.innerHTML = "";
      if(!d.resultats.length){ var n = document.createElement("span"); n.className = "mut"; n.textContent = t("aucunFourn"); R.appendChild(n); }
      d.resultats.forEach(function(x){
        var r = document.createElement("div"); r.className = "k";
        var a = document.createElement("span"); a.textContent = x.nom;
        var c = document.createElement("span");
        c.innerHTML = '<span class="dot ' + (x.ok ? "ok" : "bad") + '"></span>';
        c.appendChild(document.createTextNode(x.ok ? "OK · " + x.ms + " ms" : (x.erreur || t("echec"))));
        r.append(a, c); R.appendChild(r);
      });
    }catch(e){ R.innerHTML = ""; toast(e.message); }
    b.disabled = false;
  };

  $("gBtn").onclick = async function(){
    if(!fbAuth){ $("logErr").textContent = t("fbKo"); return; }
    $("logErr").textContent = "";
    try{ await fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    catch(e){ $("logErr").textContent = t("gKo") + " (" + (e.code || e.message) + ")."; }
  };
  if(fbAuth){
    fbAuth.onAuthStateChanged(async function(u){
      if(!u || (mode === "token" && token)) return;
      base = $("url").value.trim().replace(/\/+$/, ""); mode = "google";
      try{ await api("/admin/overview"); ecrire(true); montreApp(); }
      catch(e){ deconnecte(e.message === "401" ? (t("mailNon") + " " + (u.email || "")) : t("serveurKo2")); }
    });
  }

  appliqueLangue();
  // Reconnexion automatique si le jeton a été enregistré
  (function init(){
    var u = lire("kadm_url"), tk = lire("kadm_tok");
    if(u) $("url").value = u;
    if(u && tk){ base = u; token = tk; api("/admin/overview").then(function(){ montreApp(); }).catch(function(){ deconnecte(""); }); }
  })();
})();
</script>
</body>
</html>
